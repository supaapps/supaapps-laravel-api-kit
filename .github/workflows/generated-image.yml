name: Generated image
on:
  pull_request:
permissions:
  contents: read
jobs:
  generated-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none }
      - name: Create disposable Laravel project and render Docker stub
        run: |
          mkdir -p fixture
          docker run --rm -v "$PWD/fixture:/fixture" --entrypoint composer ghcr.io/supaapps/docker-laravel:php8.4-build-20261022.1@sha256:3d649a08e4f5a5e177c30c9a1914428ca5543ac88c5959a5fce7f4c0b4dba1cf create-project --no-plugins --no-scripts --no-dev --no-interaction laravel/laravel /fixture '^12.0'
          php <<'PHP'
          <?php
          require 'src/Support/ContainerImages.php';
          $images = Supaapps\LaravelApiKit\Support\ContainerImages::forBranch('8.4');
          $dockerfile = str_replace(['{{ buildImage }}', '{{ runtimeImage }}', '{{ gitRepo }}'], [$images['build'], $images['runtime'], 'https://example.com/application'], file_get_contents('stubs/Dockerfile.stub'));
          mkdir('fixture/docker');
          file_put_contents('fixture/Dockerfile', $dockerfile);
          copy('stubs/startup.sh.stub', 'fixture/docker/startup.sh');
          copy('stubs/.dockerignore.stub', 'fixture/.dockerignore');
          PHP
      - name: Build and boot generated runtime
        run: |
          docker build --target runtime -t local/generated:runtime fixture
          docker run --rm --network none --entrypoint php local/generated:runtime artisan --version
          docker run --rm --network none --entrypoint httpd local/generated:runtime -t
          docker run --rm --entrypoint sh local/generated:runtime -ec '! command -v composer; ! command -v gcc; test ! -f /var/www/.env'
